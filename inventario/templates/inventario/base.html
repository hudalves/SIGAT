{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SIGAT{% endblock %} — SIGAT</title>
  <link rel="stylesheet" href="{% static 'inventario/style.css' %}">
</head>
<body>
<header>
  <a class="marca" href="{% url 'inventario:home' %}">SIGAT</a>
  <a href="{% url 'inventario:planta' %}">Planta</a>
  <a href="{% url 'inventario:equipamento_lista' %}">Equipamentos</a>
  <a href="{% url 'inventario:ambiente_lista' %}">Ambientes</a>
</header>
<main>
  {% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
