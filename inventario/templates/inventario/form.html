{% extends "inventario/base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ titulo }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Salvar</button>
    <a class="btn sec" href="javascript:history.back()">Cancelar</a>
  </form>
</div>
{% endblock %}
